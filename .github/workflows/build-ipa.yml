name: Build unsigned IPA

# workflow_dispatch only — never auto-run on push (one build per explicit request).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The committed Vendor/idevice/libidevice_ffi.a is from an older idevice
      # revision without lockdownd_pair/image_mounter. Fetch the matching
      # v0.1.68 arm64 iOS slice (kept out of git: 196 MB > GitHub push limit).
      - name: Fetch vendored idevice FFI (v0.1.68, arm64 iOS)
        run: |
          curl -sL -o /tmp/xc.zip \
            "https://github.com/jkcoxson/idevice/releases/download/v0.1.68/idevice-xcframework-v0.1.68.zip"
          echo "c9eccdd1942de756d746a2569d93302774ab0eff1cff314ec8118f768b3d8dc7  /tmp/xc.zip" | shasum -a 256 -c -
          unzip -o -q /tmp/xc.zip "swift/IDevice.xcframework/ios-arm64/*" -d /tmp/xc
          cp /tmp/xc/swift/IDevice.xcframework/ios-arm64/libidevice_ffi.a Vendor/idevice/libidevice_ffi.a
          ls -lh Vendor/idevice/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app (device)
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Locus.app" Payload/
          # Embed entitlements into the binary so TrollStore/roothide preserve
          # them on install (no-sandbox → usbmuxd socket path).
          brew install ldid
          ldid -SLocus/Resources/Locus.entitlements Payload/Locus.app/Locus
          ldid -e Payload/Locus.app/Locus > embedded-entitlements.plist
          cat embedded-entitlements.plist
          rm -f embedded-entitlements.plist
          zip -qry Locus-unsigned-ios16.ipa Payload
          ls -lh Locus-unsigned-ios16.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-ios16
          path: Locus-unsigned-ios16.ipa
          if-no-files-found: error
