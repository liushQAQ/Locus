name: Build unsigned IPA

# workflow_dispatch only — never auto-run on push (one build per explicit request).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app (device)
        run: |
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/Locus.app" Payload/
          zip -qry Locus-unsigned-ios16.ipa Payload
          ls -lh Locus-unsigned-ios16.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-ios16
          path: Locus-unsigned-ios16.ipa
          if-no-files-found: error
